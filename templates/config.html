<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHANOKOR 369 | SYSTEM CONFIG</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <style>
        :root {
            --bg-color: #060b16;
            --panel-bg: #0c1322;
            --cyan: #00f0ff;
            --magenta: #ff0055;
            --green: #00ff66;
            --text-color: #8fa0dd;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', monospace;
            padding: 15px;
            margin: 0;
        }
        .config-header {
            border: 1px solid var(--magenta);
            background: var(--panel-bg);
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
            margin-bottom: 15px;
        }
        .config-card {
            border: 1px solid #1a263f;
            background: var(--panel-bg);
            padding: 15px;
            margin-bottom: 15px;
        }
        .config-title {
            color: #fff;
            font-size: 0.9rem;
            border-left: 3px solid var(--magenta);
            padding-left: 8px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            color: #fff;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            background: #040811;
            border: 1px solid #233554;
            color: var(--cyan);
            padding: 10px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus, select:focus {
            border-color: var(--cyan);
            outline: none;
        }
        .btn-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .cyber-btn {
            background: #111a2e;
            border: 1px solid #233554;
            color: #fff;
            padding: 12px;
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            text-decoration: none;
        }
        .btn-save {
            background: #00b386 !important;
            border-color: var(--green) !important;
        }
    </style>
</head>
<body>

    <div class="config-header">
        <h2 style="color: #fff; margin: 0 0 5px 0;">🛠️ SYSTEM CONFIGURATION</h2>
        <div style="font-size: 0.8rem; color: var(--magenta);">MAHANOKOR INTERACTION INTERFACE</div>
    </div>

    <div class="config-card">
        <div class="config-title">🌐 AI ENGINE & PLATFORM SETTINGS</div>
        <div class="form-group">
            <label>ឈ្មោះគម្រោងប្រព័ន្ធ (SYSTEM NAME)</label>
            <input type="text" id="sys-name" value="MAHANOKOR-369">
        </div>
        <div class="form-group">
            <label>ម៉ូឌែលខួរក្បាល AI (CORE ENGINE)</label>
            <select id="core-engine">
                <option value="KHOEM_AI_v3.6.9">KHOEM_AI_v3.6.9 (Active)</option>
                <option value="MAHANOKOR_KERNEL_v1.0">MAHANOKOR_KERNEL_v1.0</option>
            </select>
        </div>
    </div>

    <div class="config-card">
        <div class="config-title">🛡️ SECURITY LAYER CONTROL</div>
        <div class="form-group">
            <label>កម្រិតការពារ (MATRIX LAYER PROTECTION)</label>
            <select id="matrix-layers">
                <option value="45_LAYERS">45 LAYERS AUTO-DEFENSE (MAX)</option>
                <option value="30_LAYERS">30 LAYERS OPTIMAL</option>
            </select>
        </div>
        <div class="form-group">
            <label>ស្ថានភាពតំណភ្ជាប់ (FIREWALL PROTOCOL)</label>
            <input type="text" value="SECURE_SSL_EMPIRE_PROTOCOL" readonly style="color: var(--green); opacity: 0.8;">
        </div>
    </div>

    <div class="btn-group">
        <button class="cyber-btn" onclick="location.href='/'">◀ ត្រឡប់ក្រោយ</button>
        <button class="cyber-btn btn-save" onclick="saveConfiguration()">💾 រក្សាទុកការកំណត់</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script>
        var socket = io();

        function saveConfiguration() {
            var sysName = document.getElementById('sys-name').value;
            var coreEngine = document.getElementById('core-engine').value;
            var layers = document.getElementById('matrix-layers').value;

            // ផ្ញើពាក្យបញ្ជាទៅកាន់ main.py តាមរយៈ SocketIO ដើម្បីកត់ត្រាទុកក្នុង Database
            socket.emit('execute_command', {
                action: `UPDATE_CONFIG: ${sysName} | ${coreEngine} | ${layers}`
            });

            alert("កែសម្រួលការកំណត់ប្រព័ន្ធ MAHANOKOR-369 ជោគជ័យ!");
            // ត្រឡប់ទៅកាន់ទំព័រដើមវិញដោយស្វ័យប្រវត្តិ
            location.href = '/';
        }
    </script>
</body>
</html>
